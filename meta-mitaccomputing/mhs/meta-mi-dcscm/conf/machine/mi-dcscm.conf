KMACHINE = "aspeed"

UBOOT_MACHINE = "mitac-mi-dcscm_defconfig"
UBOOT_DEVICETREE = "ast2600-mi-dcscm"
SPL_BINARY = "spl/u-boot-spl.bin"

OBMC_COMPATIBLE_NAMES = "com.mitac.Hardware.BMC.Model.Mi-DCSCM"

require conf/machine/include/ast2600.inc
require conf/machine/include/obmc-bsp-common.inc
require conf/machine/include/mitac.inc

KBUILD_DEFCONFIG = "aspeed_g6_defconfig"
KERNEL_DEVICETREE += "aspeed/${KMACHINE}-bmc-mitac-e7142.dtb"
KERNEL_DEVICETREE += "aspeed/${KMACHINE}-bmc-mitac-r520g6.dtb"
KERNEL_DEVICETREE += "aspeed/${KMACHINE}-bmc-mitac-r520g6.mctp_smbus.dtb"
KERNEL_DEVICETREE += "aspeed/${KMACHINE}-bmc-mitac-s8051.dtb"
KERNEL_DEVICETREE += "aspeed/${KMACHINE}-bmc-mitac-c810z5.dtb"


PLATFORM_PROFILES = " \
	com.mitac.Hardware.Chassis.Model.E7142 \
	com.mitac.Hardware.Chassis.Model.R520G6 \
	com.mitac.Hardware.Chassis.Model.S8050 \
        com.mitac.Hardware.Chassis.Model.C810Z5 \
	"

SOCSEC_SIGN_ENABLE = "0"
# S8261 has 64MB SPI flash
FLASH_SIZE = "65536"
