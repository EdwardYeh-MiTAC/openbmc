KMACHINE = "aspeed"

UBOOT_MACHINE = "mitac-capri_defconfig"
UBOOT_DEVICETREE = "ast2600-capri"
SPL_BINARY = "spl/u-boot-spl.bin"

OBMC_COMPATIBLE_NAMES = "com.mitac.Hardware.BMC.Model.Capri"

require conf/machine/include/ast2600.inc
require conf/machine/include/obmc-bsp-common.inc
require conf/machine/include/mitac.inc

KBUILD_DEFCONFIG = "aspeed_g6_defconfig"
KERNEL_DEVICETREE += "aspeed/${KMACHINE}-bmc-mitac-capri2.dtb"

PLATFORM_PROFILES = " \
	com.mitac.Hardware.Chassis.Model.Capri_V2 \
	"

SOCSEC_SIGN_ENABLE = "0"
# S8261 has 64MB SPI flash
FLASH_SIZE = "65536"
