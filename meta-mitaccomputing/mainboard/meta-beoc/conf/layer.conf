# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "beoc-layer"
BBFILE_PATTERN_beoc-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_beoc-layer = "6"
LAYERSERIES_COMPAT_beoc-layer = "walnascar scarthgap"
