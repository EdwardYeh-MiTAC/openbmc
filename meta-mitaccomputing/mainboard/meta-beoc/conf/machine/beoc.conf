KMACHINE = "aspeed"
UBOOT_MACHINE = "mitac-beoc_defconfig"
UBOOT_DEVICETREE = "ast2600-beoc"
SPL_BINARY = "spl/u-boot-spl.bin"

OBMC_COMPATIBLE_NAMES = "com.mitac.Hardware.BMC.Model.BEOC"

require conf/machine/include/ast2600.inc
require conf/machine/include/obmc-bsp-common.inc
require conf/machine/include/mitac.inc

KBUILD_DEFCONFIG = "aspeed_g6_defconfig"
KERNEL_DEVICETREE += "aspeed/${KMACHINE}-bmc-mitac-s8050.dtb"
KERNEL_DEVICETREE += "aspeed/${KMACHINE}-bmc-mitac-s8056.dtb"
KERNEL_DEVICETREE += "aspeed/${KMACHINE}-bmc-mitac-s8261.dtb"
KERNEL_DEVICETREE += "aspeed/${KMACHINE}-bmc-mitac-sc513g6.dtb"

PLATFORM_PROFILES = " \
	com.mitac.Hardware.Chassis.Model.S8056 \
	com.mitac.Hardware.Chassis.Model.S8050 \
	com.mitac.Hardware.Chassis.Model.S8261 \
	com.mitac.Hardware.Chassis.Model.SC513G6 \
	"

SOCSEC_SIGN_ENABLE = "0"
# S8050 has 64MB SPI flash
FLASH_SIZE = "65536"
