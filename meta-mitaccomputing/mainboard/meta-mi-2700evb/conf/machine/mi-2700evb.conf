require conf/machine/include/ast2700-sdk.inc
require conf/machine/include/ast2700-a0.inc
require conf/machine/include/obmc-bsp-common.inc
KMACHINE = "aspeed"

# Overwrite flash layout
FLASH_SIZE = "131072"
FLASH_BMCU_SIZE:flash-131072 = "768"
FLASH_UBOOT_OFFSET:flash-131072 = "0"
FLASH_UBOOT_ENV_OFFSET:flash-131072 = "2048"

# 0x00220000	KERNEL: 1024 * 2176
# 0x00C00000	ROFS: 1024 * 12288
# 0x06000000	RWFS: 1024 * 98304
# 0x08000000	128MB
FLASH_KERNEL_OFFSET:flash-131072 = "2176"
#FLASH_ROFS_OFFSET:flash-131072 = "11392"
FLASH_ROFS_OFFSET:flash-131072 = "12288"
FLASH_RWFS_OFFSET:flash-131072 = "98304"
RWFS_SIZE = "33554432"

# BootMCU Build Settings
# TODO: A0-stepping
BOOTMCU_MACHINE = "ibex-ast2700a0_defconfig"
BOOTMCU_FW_BINARY = "ast2700a0-ibex-spl.bin"

# TODO: A0-stepping
UBOOT_MACHINE = "evb-ast2700a0_defconfig"
UBOOT_DEVICETREE = "ast2700-evb"
UBOOT_SIGN_ENABLE = "1"
UBOOT_FITIMAGE_ENABLE = "1"

OBMC_COMPATIBLE_NAMES = "com.mitac.Hardware.BMC.Model.Mi-2700EVB"

require conf/machine/include/mitac.inc
SERIAL_CONSOLES ?= "115200;ttyS12"

KBUILD_DEFCONFIG = "aspeed_g7_defconfig"
KERNEL_DEVICETREE += "aspeed/ast2700a0-evb.dtb"

PLATFORM_PROFILES = " \
	com.mitac.Hardware.Chassis.Model.Template \
	"

# From communitry
#SOCSEC_SIGN_ENABLE = "0"
# TODO: From AMD...
#UBOOT_SIGN_ENABLE = "0"

EXTRA_IMAGEDEPENDS:append = " \
    aspeed-image-recoveryuart \
    "

