# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mi-2700evb-layer"
BBFILE_PATTERN_mi-2700evb-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_mi-2700evb-layer = "7"
LAYERSERIES_COMPAT_mi-2700evb-layer = "walnascar scarthgap"
