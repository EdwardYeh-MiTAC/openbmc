- name: errorlog path group
  class: group
  group: path
  members:
    - meta: PATH
      path: /xyz/openbmc_project/logging

- name: pathwatch errorlog
  class: pathwatch
  pathwatch: path
  paths: errorlog path group
  pathcallback: create errorlog event

- name: create errorlog event
  class: pathcallback
  pathcallback: eventpath
  paths: errorlog path group
  eventType: ErrorTrap
